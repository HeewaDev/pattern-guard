[package]
name = "pattern-guard-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reverse proxy protecting web apps with Pattern-Guard: WAF, behavioural ML, proof-of-work bot challenge, CrowdSec/Suricata/Wazuh intelligence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heewadev/pattern-guard"

[dependencies]
pattern-guard = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
