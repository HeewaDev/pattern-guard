[package]
name = "pattern-guard"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Adaptive request-abuse detection: learns normal traffic, scores requests with an explainable ML model, recommends allow/warn/delay/challenge/block"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heewadev/pattern-guard"

[lib]
name = "pattern_guard"
path = "src/lib.rs"

[[bin]]
name = "pattern-guard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
log = "0.4"
lru = "0.12"
serde_json = "1"
regex = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "check_bench"
harness = false
